[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Observability and tracing toolkit for AI agent execution"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AgentTrace Contributors" },
]
keywords = ["ai", "agent", "tracing", "observability", "monitoring", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
homepage = "https://github.com/zzy133131/agenttrace"
repository = "https://github.com/zzy133131/agenttrace"

[project.scripts]
agenttrace = "agenttrace.cli.main:app"

[tool.setuptools.packages.find]
include = ["agenttrace", "agenttrace.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
